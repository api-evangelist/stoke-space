aid: stoke-space
name: Stoke Space
description: 'Stoke Space Technologies is an American space launch company based in Kent, Washington,
  founded in 2020 by a team of former Blue Origin and SpaceX engineers, led by co-founders Andy Lapsa
  and Tom Feldman (both ex-Blue Origin). The company is
  developing Nova, a medium-lift, 100% fully reusable rocket aimed at dramatically lowering the cost of
  access to orbit, along with its Zenith full-flow staged-combustion first-stage engine, the Andromeda
  second-stage engine, and a reusable metallic reentry heat shield. Stoke operates a 168,000 sq ft
  assembly facility and headquarters in Kent and a rocket test site near Moses Lake, Washington. Backed
  by Spark Capital and others, the company extended its Series D financing to $860 million in 2026. Stoke
  Space is a physical aerospace/hardware manufacturer and launch provider; it publishes no public
  developer API, API documentation, or developer portal.'
